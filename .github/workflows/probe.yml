name: probe
on:
  push:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/326781c7-sborka
      - name: resolve modrinth candidates
        run: python3 scripts/resolve.py 2> /tmp/resolve.err; tail -2 /tmp/resolve.err
      - name: commit report
        run: |
          set -e
          mkdir -p .ci/out
          cp build/report/candidates.txt build/report/problems.txt .ci/out/ 2>/dev/null || true
          cp /tmp/resolve.err .ci/out/resolve.err || true
          git config user.name "ci"; git config user.email "ci@local"
          git add -A .ci build || true
          git commit -m "ci: resolve report" || echo "nothing to commit"
          git push origin HEAD:arena/326781c7-sborka || true
