name: package

on:
  workflow_dispatch:
    inputs:
      build_rar:
        description: "Build the RAR archive"
        default: "true"
  push:
    paths:
      - "pack/modlist.json"
      - "pack/config/**"
      - "pack/docs/**"
      - "pack/compat-rules.json"
      - "scripts/**"
      - ".github/workflows/package.yml"

concurrency:
  group: package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/326781c7-sborka
      - name: version engine unit tests
        run: python3 scripts/tests/test_versions.py
      - name: install rar
        run: |
          sudo apt-get update -qq
          if ! sudo apt-get install -y -qq rar unrar; then
            curl -sSLo /tmp/rarlinux.tar.gz https://www.rarlab.com/rar/rarlinux-x64-624.tar.gz
            tar xzf /tmp/rarlinux.tar.gz -C /tmp
            sudo cp /tmp/rar/rar /tmp/rar/unrar /usr/local/bin/
          fi
          rar 2>&1 | head -2
      - name: resolve manifest
        run: python3 scripts/resolve_pack.py 2>&1 | tee /tmp/resolve.log
      - name: download mods (client)
        run: python3 scripts/download_mods.py client 2>&1 | tee /tmp/dl-client.log
      - name: download mods (server)
        run: python3 scripts/download_mods.py server 2>&1 | tee /tmp/dl-server.log
      - name: static compatibility scan
        id: scan
        if: hashFiles('build/run/client/mods/*.jar') != ''
        continue-on-error: true
        run: python3 scripts/scan.py build/run/client/mods --json build/report/scan.json 2>&1 | tee /tmp/scan.log
      - name: build archives
        if: hashFiles('build/run/client/mods/*.jar') != ''
        run: python3 scripts/build_pack.py 2>&1 | tee /tmp/build.log
      - name: diagnostics
        if: always()
        run: |
          python3 - <<'PY' 2>&1 | tee /tmp/diag.log
          import json
          try:
              man = json.load(open("build/manifest.json"))
              print("manifest entries:", len(man["mods"]), "size MB:", man["total_size_mb"])
              for m in man["mods"]:
                  if "unsupported" in (m["client_side"], m["server_side"]):
                      print(f"  side {m['slug']:<34} client={m['client_side']} server={m['server_side']}")
          except Exception as exc:
              print("no manifest:", exc)
          try:
              sc = json.load(open("build/report/scan.json"))
              for j in sc["jars"]:
                  if j.get("nested_ids"):
                      print("JiJ", j["file"], "->", ", ".join(j["nested_ids"]))
          except Exception as exc:
              print("no scan:", exc)
          PY
      - name: setup server
        run: bash scripts/install_server.sh 2>&1 | tee /tmp/install.log
      - name: runtime smoke test
        id: runtime
        continue-on-error: true
        timeout-minutes: 25
        run: python3 scripts/runtime_test.py 2>&1 | tee /tmp/runtime.log
      - name: publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sborka-rpg-pack
          if-no-files-found: warn
          path: |
            build/*.mrpack
            build/*.rar
            build/report/*
      - name: commit logs
        if: always()
        run: |
          mkdir -p report
          rm -f report/ci-*.log report/server-latest.log report/manifest.txt report/scan.json report/runtime.txt
          for f in resolve dl-client dl-server scan build install runtime diag; do
            [ -f /tmp/$f.log ] && cp /tmp/$f.log report/ci-$f.log || true
          done
          for f in manifest.txt scan.json runtime.txt server-errors.log; do
            [ -f build/report/$f ] && cp build/report/$f report/ || true
          done
          if [ -f build/run/server/logs/latest.log ]; then
            tail -c 700000 build/run/server/logs/latest.log > report/server-latest.log || true
          fi
          git config user.name "ci"; git config user.email "ci@local"
          git add -A report || true
          git commit -m "ci: package logs" || echo "nothing to commit"
          git push origin HEAD:arena/326781c7-sborka || true
