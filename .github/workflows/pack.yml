name: pack
on:
  workflow_dispatch:
  push:
    paths:
      - "pack/modlist.json"
      - "scripts/resolve_pack.py"
jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/326781c7-sborka
      - name: resolve pack
        run: python3 scripts/resolve_pack.py || true
      - name: commit report
        run: |
          set -e
          git config user.name "ci"; git config user.email "ci@local"
          mkdir -p report
          cp build/report/manifest.txt report/manifest.txt 2>/dev/null || true
          cp build/report/scan.json report/scan.json 2>/dev/null || true
          git add -A report || true
          git commit -m "ci: pack resolve report" || echo "nothing"
          git push origin HEAD:arena/326781c7-sborka || true
