# ============================================================================
#  Gateways to Eternity  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/gateways/gateways.json
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# волны = «рогалик-слой» данжей: 5 волн хватает на тир 1
waveCount
    по умолчанию : 10
    РЕКОМЕНДУЕТСЯ: 5 (тир 1) … 12 (тир 5)

# награда должна соответствовать тиру, а не быть случайной
rewardLootTable
    по умолчанию : gateways:default
    РЕКОМЕНДУЕТСЯ: кастомная: aetherfall:gateway_tier_<n>

# каждая волна +12 % HP/урона — иначе поздние волны тривиальны
mobScaling
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true, scalingPerWave 1.12

# нельзя фармить бесконечно в одной точке
gatewayCooldown
    по умолчанию : 0
    РЕКОМЕНДУЕТСЯ: 6000 ticks (5 мин)

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
