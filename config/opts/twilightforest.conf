# ============================================================================
#  Twilight Forest  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/twilightforest-common.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# запрет входа в поздние зоны до убийства босса — родной гейтинг, не выключать
progressionRules
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# портал не должен быть доступен на 10-й минуте
portalCreation
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true, но требуется «Ключ Вейла» (крафт тир 2)

# TF-боссы сбалансированы, бусты не нужны
bossHealth
    по умолчанию : vanilla
    РЕКОМЕНДУЕТСЯ: ×1.0

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
