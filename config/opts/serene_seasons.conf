# ============================================================================
#  Serene Seasons  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/sereneseasons/seasons.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# 20 дней = успеваешь посеять и собрать дважды; 10 дней фрустрирует
seasonCycleTicks
    по умолчанию : 240000 (10 дней)
    РЕКОМЕНДУЕТСЯ: 480000 (20 игровых дней)

# старт всегда в весну — новичок не наказан слепым выбором
startingSeason
    по умолчанию : SPRING
    РЕКОМЕНДУЕТСЯ: SPRING

# сезон должен блокировать фермерство (навык I.3), кроме теплиц
cropsIgnoreSeason
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: false

# плавные переходы, нет шока от смены сезона
subSeasonTicks
    по умолчанию : 24000
    РЕКОМЕНДУЕТСЯ: 24000 (1 игровой день)

# снег по всему миру = проблемы с CTOV и Terralith
snowInWinter
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true, но только выше Y=90

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
