# ============================================================================
#  Curios API  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/curios-common.toml / curios-server.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# слоты — награда за репутацию
slots.charm
    по умолчанию : 1
    РЕКОМЕНДУЕТСЯ: 2 (по 1 за репутацию «Уважение» у Алхимиков и Торговцев)

# 
slots.ring
    по умолчанию : 2
    РЕКОМЕНДУЕТСЯ: 4 (2 базовых, 2 через таланты)

# 
slots.belt
    по умолчанию : 1
    РЕКОМЕНДУЕТСЯ: 1

# второй «спина» = дубль рюкзаков
slots.back
    по умолчанию : 0
    РЕКОМЕНДУЕТСЯ: 1 (только Sophisticated Backpacks)

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
