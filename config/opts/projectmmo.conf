# ============================================================================
#  Project MMO  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/pmmo/*.json (settings, perks, requirements)
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# пак даёт 4 навыка × много действий: без множителя 0.75 прокачка до 100 занимает <20 ч
general.xpGainMultiplier
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 0.75

# 100 — долгая цель; Crafting быстрее, т.к. меньше действий
general.maxLevel
    по умолчанию : 100
    РЕКОМЕНДУЕТСЯ: 100 (Mining/Farming/Fishing/Cooking/Husbandry), 50 (Crafting)

# кривая должна «выпрямляться» на 60+: см. таблицу в liveskills.md
general.levelCurve
    по умолчанию : quadratic
    РЕКОМЕНДУЕТСЯ: quadratic, baseXpPerLevel 120

# гейтинг экипировки по навыку — ключ к «ремесло важно»
requirement.enforce
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true для предметов тира 3+ (адамантий, мифрил, элитные инструменты)

# активные перки дублируют дерево талантов Puffish
perks.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true (только пассивные: +HP, +скорость добычи, +шанс дропа)

# разбор снаряжения → материалы: связывает Кузнечное дело и экономику
salvage.enabled
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true, salvageRatio 0.35

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
