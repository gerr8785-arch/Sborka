# ============================================================================
#  ChoiceTheorem's Overhauled Village  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/ctov/*.json
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# обязательно для Terralith: иначе деревни только в ванильных биомах
useBiomeTags
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true

# чуть мягче: у Tectonic крутые склоны, иначе деревни пропадают
maxSlope
    по умолчанию : 8
    РЕКОМЕНДУЕТСЯ: 12

# посадка домов на рельеф Tectonic
flattenTerrain
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true

# деревни — центры квестов; 40 чанков = «дойти за 10 минут», а не «через одну»
villageSpacing
    по умолчанию : 34
    РЕКОМЕНДУЕТСЯ: 40

# нужны NPC для 5 фракций и квестодателей
villagerCount
    по умолчанию : vanilla
    РЕКОМЕНДУЕТСЯ: +25 % (но не более 18 на деревню)

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
