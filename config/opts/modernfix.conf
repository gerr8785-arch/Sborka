# ============================================================================
#  ModernFix  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/modernfix-mixins.properties
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# 
mixin.perf.dynamic_resources
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false (конфликт с FerriteCore)

# ускоряет /reload
mixin.perf.dedicated_reload_executor
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# перекрывает MemoryLeakFix
mixin.bugfix.world_leaks
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false

# 
mixin.perf.blast_search_trees
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
