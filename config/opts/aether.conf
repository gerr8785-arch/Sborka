# --- Параметры ---------------------------------------------------------------
# —
spawnRateWhirlwind
    по умолчанию : default
    РЕКОМЕНДУЕТСЯ: 0.8

# внимание: свои слоты, не Curios — не конфликтуют
accessorySlotCount
    по умолчанию : 8
    РЕКОМЕНДУЕТСЯ: оставить 8 (Curios-независимые)

# 
startupLoot
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true (стартовые книги в сундуке портала)

# --- Чек-лист применения -----------------------------------------------------
