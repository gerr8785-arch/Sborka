# ============================================================================
#  KubeJS — чистка JEI (скрипт пака)  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: kubejs/client_scripts/hide_items.js
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# 238 модов: без чистки в JEI 6000+ записей
hidden_categories
    по умолчанию : —
    РЕКОМЕНДУЕТСЯ: технические предметы (spawn eggs кастомных мобов, пустые вёдра, debug-блоки)

# новичок должен видеть сложные предметы — это мотивация
hide_mode
    по умолчанию : —
    РЕКОМЕНДУЕТСЯ: скрывать только бесполезное, не «сложное»

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
