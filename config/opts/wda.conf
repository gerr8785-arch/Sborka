# ============================================================================
#  When Dungeons Arise  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/wda.cfg (server)
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# 70+ данжей на дефолте превращают мир в «данж-парк»
structureWeight
    по умолчанию : 10
    РЕКОМЕНДУЕТСЯ: 5

# разносим структуры, чтобы между ними была «пустая» природа
spacing
    по умолчанию : 20
    РЕКОМЕНДУЕТСЯ: 34

# исключает наложение данжей
separation
    по умолчанию : 8
    РЕКОМЕНДУЕТСЯ: 12

# лут тирингуем через LootJS, множитель чуть ниже — компенсация количества
dungeonLootMultiplier
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 0.85

# ад отдан Incendium — иначе двойные структуры
enableNetherStructures
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
