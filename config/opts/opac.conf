# ============================================================================
#  Open Parties and Claims  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/openpartiesandclaims-server.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# базы игроков + деревни
claims.maxClaimsPerPlayer
    по умолчанию : 10
    РЕКОМЕНДУЕТСЯ: 25

# иначе квесты в деревнях невозможны
claims.blockInteractionsOutsiders
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false для «дружелюбных» блоков (двери, кнопки)

# 
parties.maxPartySize
    по умолчанию : 8
    РЕКОМЕНДУЕТСЯ: 10 (сервер на 5–10 игроков)

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
