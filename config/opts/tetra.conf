# ============================================================================
#  Tetra  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/tetra/ + kubejs/server_scripts/tetra_bettercombat.js
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# заточка — часть «Кузнечного дела», но не должна заменять аффиксы
honing.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true, honingBonus 0.08

# модульный бог-меч ломает тир-гейт
modules.maxPerItem
    по умолчанию : default
    РЕКОМЕНДУЕТСЯ: 2 базовых + 2 улучшения

# связка навык ↔ экипировка
workbenchTierGate
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true (верстак 3-го тира требует Mining 40)

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
