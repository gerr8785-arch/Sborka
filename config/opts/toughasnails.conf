# ============================================================================
#  Tough As Nails  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/toughasnails-common.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# жажда — базовый цикл, но не должна требовать пить каждые 3 минуты
thirst.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true, thirstDepletionRate 0.85

# мягче дефолта: First Aid уже даёт травмы
temperature.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true, temperatureModifier 0.9

# зимой нужна одежда — это гейт, а не наказание
seasonalTemperatureModifier
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true (с Serene Seasons)

# QoL: иначе рюкзак занят бутылками весь тир 1
purifiedWaterBottleStackSize
    по умолчанию : 1
    РЕКОМЕНДУЕТСЯ: 8

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
