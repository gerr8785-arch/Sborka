# ============================================================================
#  Alex's Caves  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/alexscaves-general.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# 6 подземных биомов при 1.0 перекрывают друг друга
caveBiomeRarity
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 0.8

# игрок должен «путешествовать», а не падать из одного биома в другой
caveBiomeDistance
    по умолчанию : default
    РЕКОМЕНДУЕТСЯ: +20 % (разносим)

# конфликт с Oculus (см. conflicts 5.7)
biomeAmbience
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false (при включённых шейдерах)

# опционально: часть контента только после тира 3
nostalgiaMode
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true (ограничить пресеты тиром)

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
