# ============================================================================
#  Alex's Mobs  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/alexsmobs.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# 90+ мобов при дефолте вытесняют ванильную фауну и ванильных врагов
spawnRates.global
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 0.85

# —
dangerousMobSpawnRate
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 0.9

# фауна по биомам — ядро «экосистемы»
mobSpawnBiomeWeights
    по умолчанию : default
    РЕКОМЕНДУЕТСЯ: оставить

# бесполезный моб, ломает баланс рыбалки в аду
enableLavaSquid
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
