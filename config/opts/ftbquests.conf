# ============================================================================
#  FTB Quests  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/ftbquests/ (server: quests.json — в датапаке)
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# гейтинг рецептов ломает Tetra/EMI-подсказки
disable_gui_recipe_locking
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true

# награды — предметы в инвентарь, без «выпало на пол»
drop_item_rewards
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false

# не показывать главы тира 5 новичку
hide_until_unlocked
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true

# кооп в MP обязателен (5–10 игроков)
team_sharing
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# см. reputation-system.md §J.3
quest_refresh_days
    по умолчанию : —
    РЕКОМЕНДУЕТСЯ: 3 игровых дня (KubeJS-ротация)

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
