# ============================================================================
#  JourneyMap  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/journeymap/journeymap.cfg
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# серверное картирование = нагрузка на TPS
mapping.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true на клиенте, false на сервере

# радар = читерство в PvP-серверах
radar.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false (античит/честность MP)

# вайпоинты для квестов «найди структуру»
waypoint.max
    по умолчанию : 80
    РЕКОМЕНДУЕТСЯ: 150

# связка с FTB Quests (журнал открытий)
journal.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
