# ============================================================================
#  LootJS (скрипты пака)  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: kubejs/server_scripts/loot/*.js
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# лут должен соответствовать тиру локации, а не мобу
tiered_loot_rule
    по умолчанию : —
    РЕКОМЕНДУЕТСЯ: тир 1: железо/кожа; тир 3: алмаз/апофеоз rare; тир 5: mythic + фрагменты артефактов

# 
boss_unique_drops
    по умолчанию : —
    РЕКОМЕНДУЕТСЯ: 1 гарантированный уникальный дроп с каждого из 26 боссов

# 
remove_vanilla_dupes
    по умолчанию : —
    РЕКОМЕНДУЕТСЯ: удалить дубли руд/слитков (unification) через LootJS + KubeJS recipes

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
