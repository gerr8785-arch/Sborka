# ============================================================================
#  KubeJS  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: kubejs/config/common.properties + startup/server/client_scripts
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# консольный спам в мультиплеере
announceReload
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false

# packmode позволяет переключать баланс без пересборки
packmode
    по умолчанию : normal
    РЕКОМЕНДУЕТСЯ: normal (expert — только для сезонного ивента)

# нужен для отладки унификации рецептов
enableRecipeLogging
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true (только на этапе сборки)

# порядок важен: теги должны существовать до проверок
script_priority
    по умолчанию : —
    РЕКОМЕНДУЕТСЯ: серверные скрипты: 1) unification 2) tags 3) reputation 4) quests bridge

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
