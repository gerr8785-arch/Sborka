# ============================================================================
#  Corail Tombstone  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/tombstone-common.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# 
graves.grave_effects
    по умолчанию : soulbound etc.
    РЕКОМЕНДУЕТСЯ: только grave_soulbound для квестовых предметов

# вещи сохраняются 45 минут — «честная» смерть
death_handling.keep_inventory
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: false, но degradation_time 45 мин

# штраф есть, но не откат на час
loss_penalty.xp_loss
    по умолчанию : default
    РЕКОМЕНДУЕТСЯ: 5 % (вместо 30 %)

# не хотим «бесплатных» телепортов к могиле
angel_of_death.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false

# ключ — крафт, не покупка
grave_key.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
