# --- Параметры ---------------------------------------------------------------
# деньги из мобов — не основной доход
coinDropChance
    по умолчанию : 0.35
    РЕКОМЕНДУЕТСЯ: 0.3

# валюта для репутационной торговли
villagerTradesUseCoins
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# 
coinStackSize
    по умолчанию : 64
    РЕКОМЕНДУЕТСЯ: 64

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
