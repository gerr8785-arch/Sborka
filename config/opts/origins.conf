# ============================================================================
#  Origins (Forge)  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/origins/ + world/datapacks/01_origins_plus_plus
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# выбор расы — обязательный шаг, без него пак не начинается
origin_selection_screen
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true, forced_on_first_join: true

# смена расы — поздняя награда, не кнопка
allow_orb_of_origin
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: false (только за 1 «Эхо Раскола» + 30 уровень)

# мобильные пассивки (прыжок, планер) не должны обесценивать маунтов
power_cooldowns.mobility
    по умолчанию : default
    РЕКОМЕНДУЕТСЯ: ×1.2

# 3 слоя = раса/класс/таланты, как в спеке
layers
    по умолчанию : origin, class (2 слоя)
    РЕКОМЕНДУЕТСЯ: origin + class + 3 talent-слоя через KubeJS

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
