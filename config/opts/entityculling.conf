tracingDistance
    по умолчанию : 128
    РЕКОМЕНДУЕТСЯ: 64

# 
disableF3
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true

# --- Чек-лист применения -----------------------------------------------------
