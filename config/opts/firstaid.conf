# ============================================================================
#  First Aid  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/firstaid-common.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# иначе сумма частей ≠ max HP Apotheosis
healthPerPart
    по умолчанию : 20
    РЕКОМЕНДУЕТСЯ: 0 (использовать процентную модель)

# обязательная совместимость с атрибутными бустами Apotheosis/Puffish
usePercentage
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true

# хедшот = смертельно — поощряет шлем и позиционирование
headDamageMultiplier
    по умолчанию : 1.5
    РЕКОМЕНДУЕТСЯ: 1.5

# перелом ноги: -60 % скорости, лечится шиной (крафт Farmer's Delight)
legsBreakSpeedPenalty
    по умолчанию : 0.5
    РЕКОМЕНДУЕТСЯ: 0.4

# магический щит Iron's Spells должен поглощать удар без травмы
debuffOnShieldedHit
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false

# двойной штраф за смерть запрещён дизайном «честного хардкора»
damageOnDeath
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false (вместо этого — Corail Tombstone)

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
