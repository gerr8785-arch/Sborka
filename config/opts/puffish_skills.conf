# ============================================================================
#  Pufferfish's Skills  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/puffish_skills/config.json + skills/*.json
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# 1 очко за уровень XP: 30 уровней = 30 очков из ~140 нужных на всё дерево
pointsPerLevel
    по умолчанию : 1
    РЕКОМЕНДУЕТСЯ: 1

# 3 стартовых очка = «выбор при создании» (см. SPEC §8)
startPoints
    по умолчанию : 0
    РЕКОМЕНДУЕТСЯ: 3

# респек есть, но платный — выбор значим
respec.enabled
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true, cost 1 «Эхо Раскола» (крафт)

# потолок: нельзя выкупить всё дерево за гринд
maxPoints
    по умолчанию : ∞
    РЕКОМЕНДУЕТСЯ: 120

# 30+ узлов обязательно; синергии на пересечении веток (см. quest-tree.md)
categories
    по умолчанию : —
    РЕКОМЕНДУЕТСЯ: 4 ветки: Path of the Blade / Arcana / Wilds / Fortune, по 8–12 узлов

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
