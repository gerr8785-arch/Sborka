# ============================================================================
#  Waystones  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/waystones-server.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# экономика Numismatic Overhaul как топливо
costPerTeleport
    по умолчанию : 0
    РЕКОМЕНДУЕТСЯ: 8 монет × расстояние/100

# иначе путешествие/логистика обесценены
allowGlobalWaystones
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false до тира 3

# точка телепорта = центр квестов
generateInVillages
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true (1 на деревню)

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
