# ============================================================================
#  Combat Roll  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/combat_roll.json
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# перекат должен быть тактикой, а не стилем передвижения
cooldown
    по умолчанию : 30 ticks
    РЕКОМЕНДУЕТСЯ: 22 ticks

# i-frames 0.3 с: уклонение возможно, но не «бессмертие»
invulnerabilityTime
    по умолчанию : 10 ticks
    РЕКОМЕНДУЕТСЯ: 6 ticks

# связка с выносливостью First Aid-независимой шкалой (см. liveskills.md)
staminaCost
    по умолчанию : 8
    РЕКОМЕНДУЕТСЯ: 12

# перекат выводит из зоны удара обычного моба, но не из боссовой арены
distance
    по умолчанию : 3.0
    РЕКОМЕНДУЕТСЯ: 3.2

# иначе каст+перекат = непробиваемая комбинация
allowRollDuringAttack
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
