# ============================================================================
#  Tectonic  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/tectonic.json
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# 1.4 даёт горы высотой 400+ — мобы застревают, деревни в воздухе; 1.0 — «эпично, но играбельно»
terrain_scale
    по умолчанию : 1.4
    РЕКОМЕНДУЕТСЯ: 1.0

# нужны настоящие континенты для кораблей Small Ships
continentalness
    по умолчанию : default
    РЕКОМЕНДУЕТСЯ: усиленный (+15 %)

# CTOV-деревни должны стоять ровно
village_flatten
    по умолчанию : false
    РЕКОМЕНДУЕТСЯ: true

# иначе пещеры прорезают горы насквозь и ломают YUNG's Mineshafts
cave_carving
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true, но с cave_scale 0.85

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
