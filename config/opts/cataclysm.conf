# ============================================================================
#  L_Ender's Cataclysm  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/cataclysm-common.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# Cataclysm-боссы рассчитаны на «сильного игрока без пака»; у нас 3 источника аффиксов — снижаем HP
bossHealthMultiplier
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 0.85

# урон не трогаем: угроза должна остаться
bossDamageMultiplier
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 1.0

# 8 боссов не должны стоять через 200 блоков
structureRarity
    по умолчанию : default
    РЕКОМЕНДУЕТСЯ: +35 % реже (config: structure_spacing)

# атмосфера — категория E
allowBossMusic
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
