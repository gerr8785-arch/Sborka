# ============================================================================
#  Terralith  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/terralith.json (или datapack-конфиг)
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# рельеф Terralith оставляем, Tectonic накладывает форму сверху
terrain.enabled
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# уменьшение размера биомов → больше разнообразия в радиусе прогулки, но без «лоскутности»
biome_size
    по умолчанию : 2
    РЕКОМЕНДУЕТСЯ: 1.5

# структуры регулируем на стороне WDA/YUNG's, а не тут
structure_density
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 1.0

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
