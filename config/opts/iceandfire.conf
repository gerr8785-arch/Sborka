# ============================================================================
#  Ice and Fire  —  конфиг пака Aetherfall 1.0.0
#  Файл(ы) в инстансе: config/iceandfire-common.toml
#  Формат: не копируй целиком как .json/.toml — это карта значений.
#          Значения «рекомендуемое» вноси в соответствующий ключ файла мода.
#  Обоснование: строка «почему» = причина, привязанная к дизайну пака.
# ============================================================================

# --- Параметры ---------------------------------------------------------------
# —
generateDragonSkeletons
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true, но реже (spacing 40)

# драконы — эндгейм-маунты; при 1.0 небо закрыто драконами
dragonSpawnChance
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 0.6

# иначе дракон сносит деревню новичка
dragonBlockBreaking
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: false до тира 4 (событие «Пробуждение»)

# —
generateCyclops
    по умолчанию : true
    РЕКОМЕНДУЕТСЯ: true

# летающий маунт должен быть редкой находкой
hippogryphSpawnChance
    по умолчанию : 1.0
    РЕКОМЕНДУЕТСЯ: 0.5

# --- Чек-лист применения -----------------------------------------------------
#  [ ] Значения внесены и мод перезапущен (некоторые требуют полного рестарта)
#  [ ] Проверено в игре: /reload или новый мир
#  [ ] Отмечено в config/checklist.md
#  [ ] Если параметр не найден в текущей версии мода — зафиксировать в SPECIFICATION.md §7.9 (отклонения)
